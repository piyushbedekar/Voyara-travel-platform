# ============================================================
# SUPABASE POSTGRESQL CONFIGURATION (Local & Cloud DB)
# ============================================================
# Use: SPRING_PROFILES_ACTIVE=supabase
# Set PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD in .env
# Recommended: Use Supabase Session Pooler (port 5432) for
# IPv4 compatibility and full Flyway migration support.
# ============================================================

spring:
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE:postgres}?sslmode=${PGSSLMODE:require}&prepareThreshold=0
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECT_TIMEOUT:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
      pool-name: voyara-supabase-pool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "Existing schema baseline"
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false

  # Exclude Redis when running directly against Supabase without a local Redis server
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

seed:
  data:
    enabled: ${SEED_DATA_ENABLED:true}

app:
  jwt:
    secret: ${JWT_SECRET:c2VjdXJlLWtleS1mb3ItZGV2LW9ubHktMjAyNC1iYXNlNjQtc2VjcmV0LWtleS11c2UtMTI4Yml0cw==}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
    issuer: travel-platform
